<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍔 Burgery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>🍔 Burgery</h1>
    <div id="burger-items" class="menu-container"></div>

    <h2>Twoje zamówienie:</h2>
    <ul id="order-list"></ul>
    <p id="total-price">Łączna cena: 0 PLN</p>
    <h3>Dodaj opis do zamówienia:</h3>
    <textarea id="order-note" rows="3" placeholder="Np. bez cebuli, dodatkowy ketchup"></textarea>
    <h3>📅 Zaplanuj zamówienie:</h3>
<select id="order-time">
    <option value="10">Za 10 minut</option>
    <option value="20">Za 20 minut</option>
    <option value="30">Za 30 minut</option>
    <option value="custom">Własny czas</option>
</select>
<input type="number" id="custom-time" placeholder="Wpisz czas (minuty)" style="display:none;">

    <button id="save-order" class="menu-item">💾 Zapisz zamówienie</button>

    <a href="menu.html" class="menu-item">⬅ Powrót</a>

    <script src="app.js"></script>
</body>
</html>
