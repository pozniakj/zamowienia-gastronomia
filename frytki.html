<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frytki</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="sidebar">
        <ul>
            <li onclick="window.location.href='menu.html'">📜 Zamówienia</li>
            <li class="menu-title" onclick="window.location.href='historia.html'">📅 Historia Zamówień</li>
        </ul>
    </nav>

    <header>
        <h1>🍟 Frytki</h1>
        <p>Wybierz frytki do zamówienia.</p>
    </header>

    <div class="menu-container">
        <button class="product-button" onclick="addToOrder('Małe Frytki', 7)">Małe - 7 PLN</button>
        <button class="product-button" onclick="addToOrder('Duże Frytki', 10)">Duże - 10 PLN</button>
    </div>

    <section id="orders-section">
        <h2>📜 Twoje zamówienie</h2>
        <ul id="order-list"></ul>
        <p id="total-price">Cena całkowita: 0 PLN</p>
        <textarea id="order-note" placeholder="Dodaj notatkę do zamówienia..." rows="2"></textarea>
        <button id="save-order">Zapisz zamówienie</button>
    </section>

    <script src="app.js"></script>
</body>
</html>
