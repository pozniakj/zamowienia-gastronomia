<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historia Zamówień</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="sidebar">
        <ul>
            <li onclick="window.location.href='menu.html'">📜 Zamówienia</li>
            <li onclick="window.location.href='historia.html'">📅 Historia Zamówień</li>
        </ul>
    </nav>

    <header>
        <h1>📅 Historia Zamówień</h1>
    </header>

    <input type="date" id="date-picker">
    <div id="history-orders-container"></div>

    <button class="back-button" onclick="window.location.href='menu.html'">🔙 Powrót</button>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const datePicker = document.getElementById("date-picker");
            const historyOrdersContainer = document.getElementById("history-orders-container");

            const historyOrders = JSON.parse(localStorage.getItem("historyOrders")) || {};

            datePicker.addEventListener("change", () => {
                const selectedDate = datePicker.value;
                historyOrdersContainer.innerHTML = "";

                if (!historyOrders[selectedDate] || historyOrders[selectedDate].length === 0) {
                    historyOrdersContainer.innerHTML = "<p>Brak zamówień dla wybranej daty.</p>";
                    return;
                }

                historyOrders[selectedDate].forEach((order, index) => {
                    const orderCard = document.createElement("div");
                    orderCard.classList.add("order-card");

                    let orderContent = `<h3>📝 Zamówienie #${index + 1}</h3><ul>`;
                    let totalPrice = 0;

                    order.forEach(item => {
                        orderContent += `<li>${item.name} x${item.quantity} - ${item.price * item.quantity} PLN</li>`;
                        totalPrice += item.price * item.quantity;
                    });

                    orderContent += `</ul><p><strong>Łączna cena:</strong> ${totalPrice} PLN</p>`;
                    orderCard.innerHTML = orderContent;

                    historyOrdersContainer.appendChild(orderCard);
                });
            });
        });
    </script>
</body>
</html>
